spring:
  application:
    name: shobuj-store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shobuj}
    username: ${DB_USERNAME:shobuj}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 14d

management:
  endpoints:
    web:
      exposure:
        include: health

store:
  storage-root: ${STORAGE_ROOT:storage}
  media-url: /media
  # Where shoppers' browsers open the shop; payment pages send them back here.
  web-url: ${WEB_URL:http://localhost:3000}
  delivery:
    inside-dhaka: 100
    outside-dhaka: 200
    free-over: 5000
  sms:
    # log: write texts to the log only (local runs). sslwireless: send through SSL Wireless.
    driver: ${SMS_DRIVER:log}
    jobs:
      enabled: true
    sslwireless:
      base-url: ${SSLWIRELESS_BASE_URL:https://smsplus.sslwireless.com}
      api-token: ${SSLWIRELESS_API_TOKEN:}
      sid: ${SSLWIRELESS_SID:}
  codes:
    # One-time codes sent by text: how long they last, tries per code, and resend limits.
    valid-for: 10m
    max-attempts: 5
    resend-after: 60s
    per-phone-per-hour: 5
  payment:
    # An unpaid online order holds its plants this long, then is cancelled.
    expiry: 30m
    max-attempts: 5
    sslcommerz:
      # Credentials from the environment; online payment stays off until both are set.
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
      base-url: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
      # The address SSLCommerz posts to (return pages and IPN): the public shop address.
      callback-url: ${store.web-url}
    jobs:
      enabled: true
